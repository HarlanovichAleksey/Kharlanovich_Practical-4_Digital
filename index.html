<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Marketing Agency</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="header_title">Digital Marketing Agency</h1>
            <p class="header_text">Award winning digital marketing agency in Singapore. A home-grown company since 2018.</p>
            <button class="header_button">Find out more</button>
        </div>
    </header>

    <section class="services">
        <div class="container">
            <div class="block">
                <h2 class="block_title">OUR SERVICES</h2>
                <p class="block_text">Increase your insight and make the better experience with our valuable services.</p>
            </div>
            
            <!-- 2. Блок услуг с иконками Font Awesome вместо картинок -->
            <div class="services_items">
                <div class="services_item">
                    <!-- Иконка поисковой оптимизации -->
                    <i class="fa-solid fa-magnifying-glass-chart services_icon"></i>
                    <h3 class="services_title">Search Engine Optimization</h3>
                </div>
                <div class="services_item">
                    <!-- Иконка социальных сетей -->
                    <i class="fa-solid fa-pen services_icon"></i>
                    <h3 class="services_title">Social Media Marketing</h3>
                </div>
                <div class="services_item">
                    <!-- Иконка веб-разработки -->
                    <i class="fa-brands fa-instagram services_icon"></i>
                    <h3 class="services_title">Web Development</h3>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
